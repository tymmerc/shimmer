services:
  embedding:
    build:
      context: ./embedding-sidecar
      dockerfile: Dockerfile
    container_name: shimmer-embedding
    ports:
      - "8100:8100"
    environment:
      - MODEL_DIR=/app/model
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
